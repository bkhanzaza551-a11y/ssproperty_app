name: Build Android APK & AAB

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm install --legacy-peer-deps

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "ndk;27.1.12297006"

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/27.1.12297006" >> android/local.properties
          cat android/local.properties

      - name: Decode and setup keystore
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: |
          if [ -z "$KEYSTORE_FILE" ]; then
            echo "❌ ERROR: KEYSTORE_FILE secret is empty or missing!"
            echo "Please go to Settings > Secrets and variables > Actions"
            echo "And add the KEYSTORE_FILE secret with the base64 content."
            exit 1
          fi
          
          # Remove any whitespace/newlines and decode ignoring garbage
          echo "$KEYSTORE_FILE" | tr -d '\n\r\t ' | base64 -d -i > android/app/upload-key.jks
          
          echo "Keystore size in bytes:"
          stat -c%s android/app/upload-key.jks
          
          echo "Testing keystore validity..."
          keytool -list -v -keystore android/app/upload-key.jks -storepass sspropertyguru2024 -alias upload || {
            echo "❌ Keystore is corrupted or invalid. Please check your GitHub Secret."
            exit 1
          }
          echo "✅ Keystore is valid."

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Release APK & AAB
        run: |
          cd android
          chmod +x gradlew
          echo "Clearing Gradle cache as requested..."
          ./gradlew clean
          echo "🚀 Starting Release Build..."
          ./gradlew assembleRelease bundleRelease \
            --no-daemon \
            --stacktrace \
            --console=plain \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g"

      - name: List Build Outputs
        if: success()
        run: |
          echo "=== APK Files ==="
          find android -name "*.apk" -type f
          echo "=== AAB Files ==="
          find android -name "*.aab" -type f

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ss-property-guru-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB Artifact (Play Store)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ss-property-guru-aab-playstore
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            android/app/build/outputs/
            ~/.gradle/daemon/*/daemon-*.out.log
          retention-days: 7
